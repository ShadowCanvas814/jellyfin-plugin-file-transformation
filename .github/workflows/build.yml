name: Build for Jellyfin 12.4
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/Jellyfin.Plugin.FileTransformation/Jellyfin.Plugin.FileTransformation.csproj -c Release -p:JellyfinVersion=12.4.0 -o out
      - run: cd out && zip ../FileTransformation-12.4.0.zip *.dll *.deps.json *.pdb logo.png
      - uses: actions/upload-artifact@v4
        with:
          name: FileTransformation-12.4.0
          path: FileTransformation-12.4.0.zip
      - name: Inspect built plugin type
        run: |
          mkdir -p inspect
          cat > inspect/inspect.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Jellyfin.Model" Version="12.4.0" />
              <PackageReference Include="Jellyfin.Controller" Version="12.4.0" />
              <PackageReference Include="Jellyfin.Data" Version="12.4.0" />
              <PackageReference Include="Jellyfin.Extensions" Version="12.4.0" />
            </ItemGroup>
            <ItemGroup>
              <Reference Include="Jellyfin.Plugin.FileTransformation">
                <HintPath>../out/Jellyfin.Plugin.FileTransformation.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          EOF
          cat > inspect/Program.cs <<'EOF'
          using System.Reflection;
          using MediaBrowser.Common.Plugins;

          Console.WriteLine("Host IPlugin assembly: " + typeof(IPlugin).Assembly.FullName);

          var dllPath = Path.GetFullPath("out/Jellyfin.Plugin.FileTransformation.dll");
          Console.WriteLine("Loading: " + dllPath);

          Assembly asm;
          try
          {
              asm = Assembly.LoadFrom(dllPath);
              Console.WriteLine("Loaded assembly OK: " + asm.FullName);
          }
          catch (Exception ex)
          {
              Console.WriteLine("FAILED to load assembly: " + ex);
              return;
          }

          Type[] exportedTypes;
          try
          {
              exportedTypes = asm.GetExportedTypes();
              Console.WriteLine("GetExportedTypes() OK, count=" + exportedTypes.Length);
          }
          catch (ReflectionTypeLoadException rtle)
          {
              Console.WriteLine("GetExportedTypes() THREW ReflectionTypeLoadException:");
              foreach (var le in rtle.LoaderExceptions)
              {
                  Console.WriteLine("  LoaderException: " + le);
              }
              exportedTypes = rtle.Types.Where(t => t != null).Cast<Type>().ToArray();
          }
          catch (Exception ex)
          {
              Console.WriteLine("GetExportedTypes() THREW: " + ex);
              return;
          }

          foreach (var t in exportedTypes)
          {
              if (!(t.IsClass && !t.IsAbstract && !t.IsInterface && !t.IsGenericType))
              {
                  continue;
              }

              Console.WriteLine($"Concrete type: {t.FullName}");
              try
              {
                  bool isPlugin = typeof(IPlugin).IsAssignableFrom(t);
                  Console.WriteLine($"    IPlugin.IsAssignableFrom = {isPlugin}");
                  foreach (var i in t.GetInterfaces())
                  {
                      Console.WriteLine($"    implements: {i.FullName} (from {i.Assembly.GetName().Name} {i.Assembly.GetName().Version})");
                  }

                  var bt = t.BaseType;
                  while (bt != null)
                  {
                      Console.WriteLine($"    base: {bt.FullName} (from {bt.Assembly.GetName().Name} {bt.Assembly.GetName().Version})");
                      bt = bt.BaseType;
                  }
              }
              catch (Exception ex)
              {
                  Console.WriteLine("    ERROR inspecting type: " + ex);
              }
          }
          EOF
          dotnet run --project inspect
        continue-on-error: true
